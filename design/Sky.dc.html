<script type="text/x-dc" data-dc-script data-props='{"camera":{"editor":"enum","options":["venice","fixed"],"default":"venice"},"seconds":{"editor":"int","min":6,"max":60,"default":12},"$preview":{"width":390,"height":1250}}'>
class Component extends DCLogic {
componentDidMount() { this.play(0); }
componentWillUnmount() { this.stop(); }
stop() { if (this.raf) cancelAnimationFrame(this.raf); this.raf = null; }
curP() { return (this.state && typeof this.state.p === 'number') ? this.state.p : 0; }
play(from) {
this.stop();
const dur = (this.props.seconds ?? 12) * 1000;
const t0 = performance.now() - (from || 0) * dur;
const step = (now) => {
const p = ((now - t0) / dur) % 1;
this.setState({ p: p, playing: true });
this.raf = requestAnimationFrame(step);
};
this.setState({ playing: true });
this.raf = requestAnimationFrame(step);
}
renderVals() {
const D = Math.PI / 180;
const span = 24;
const p = this.curP();
const playing = !!(this.state && this.state.playing);
const cam = (this.state && this.state.cam) || (this.props.camera === 'fixed' ? 'fixed' : 'venice');
const locked = cam === 'venice';
const h = p * span;
const f = (n) => n.toFixed(1);
const f3 = (n) => Math.max(0, Math.min(1, n)).toFixed(3);
const wrap = (a) => ((a + 180) % 360 + 360) % 360 - 180;
// Sample model (the build uses an astronomy library): Sat 24 Oct, 00:00 to 24:00, Sun-fixed frame.
// Moon +12.19 deg/day; Venice +15 deg/h; 0 deg = facing the Sun; -90 deg = facing the viewer.
const moonDeg = (hh) => 112.5 + 0.5079 * hh;
const venDeg = (hh) => -191.5 + 15 * hh;
// Camera: fixed = no turn. Locked = the scene turns so Venice stays at -90 deg (facing you).
const camRot = (hh) => locked ? -(venDeg(hh) + 90) : 0;
const P = (deg, R) => [179 + R * Math.cos(deg * D), 170 - R * 0.343 * Math.sin(deg * D)];
const sig = camRot(h);
const mDeg = moonDeg(h) + sig;
const pathPts = (toH) => { const out = []; for (let k = 0; k <= 120; k++) { const hh = toH * k / 120; const q = P(moonDeg(hh) + camRot(hh), 140); out.push(f(q[0]) + ',' + f(q[1])); } return out.join(' '); };
const m = P(mDeg, 140);
const sm = Math.sin(mDeg * D);
const sunP = P(sig, 215);
const sunL = P(sig, 165);
const anti = (sig + 180) * D;
const ux = Math.cos(anti), uy = -0.343 * Math.sin(anti);
const ul = Math.hypot(ux, uy) || 1;
const nx = -uy / ul, ny = ux / ul;
const shadow = [[179 + nx * 30, 170 + ny * 30], [179 + ux * 165 + nx * 16, 170 + uy * 165 + ny * 16], [179 + ux * 165 - nx * 16, 170 + uy * 165 - ny * 16], [179 - nx * 30, 170 - ny * 30]].map((q) => f(q[0]) + ',' + f(q[1])).join(' ');
const lit = (1 - Math.sin(sig * D)) / 2;
const dark = 1 - lit;
const sunRight = Math.cos(sig * D) >= 0;
const quarter = (k) => { const q = P(sig + 90 * k, 140); const l = P(sig + 90 * k, 160); return { x: f(q[0]), y: f(q[1]), lx: f(Math.max(24, Math.min(334, l[0]))), ly: f(l[1] + 4) }; };
const q0 = quarter(0), q1 = quarter(1), q2 = quarter(2), q3 = quarter(3);
// Earth surface: longitude strip that slides west to east (fixed) or stays with Venice centred (locked).
const K = 32 * D;
const PER = 360 * K;
const lonV = -118.5;
const dV = locked ? 0 : wrap(venDeg(h) + 90);
const lonC = wrap(lonV - dV);
const LX = (lo) => 179 + (lo - lonC) * K;
const LY = (la) => 174 - la * 0.47;
const LAND = [
[[-165,65],[-140,70],[-95,72],[-75,62],[-60,48],[-80,30],[-82,25],[-97,18],[-105,20],[-118,32],[-125,48],[-140,58],[-160,58]],
[[-80,10],[-60,8],[-35,-8],[-40,-22],[-58,-38],[-70,-52],[-75,-40],[-72,-18],[-80,-5]],
[[-55,60],[-40,62],[-20,72],[-30,82],[-60,80]],
[[-10,36],[-5,44],[-10,52],[5,58],[20,70],[40,68],[40,45],[30,35],[35,30],[50,12],[40,-15],[30,-34],[18,-35],[12,-15],[8,5],[-17,15],[-17,25]],
[[40,68],[80,75],[140,72],[170,65],[140,50],[122,32],[120,22],[105,10],[100,22],[80,8],[72,22],[55,25],[48,30],[40,45]],
[[113,-22],[130,-12],[145,-15],[153,-28],[145,-38],[132,-32],[115,-34]]
];
const CLOUD = [
[[-150,40],[-120,44],[-100,38],[-125,34]],
[[-40,10],[0,14],[30,6],[-10,2]],
[[60,-30],[110,-26],[140,-34],[90,-38]],
[[150,20],[190,26],[200,16],[170,12]]
];
const shapes = (list, drift) => {
let d = '';
for (let c = -1; c <= 1; c++) {
for (const poly of list) {
d += 'M' + poly.map((q) => f(LX(q[0] + drift) + c * PER) + ' ' + f(LY(q[1]))).join(' L') + ' Z ';
}
}
return d;
};
const thv = venDeg(h) * D;
const thm = moonDeg(h) * D;
const vVis = Math.abs(dV) < 58;
const vx = 179 + dV * K;
const vy = LY(34);
const up = Math.cos(thv - thm) > 0;
const stamp = (hh) => {
const mins = Math.round(hh * 60);
const d = Math.floor(mins / 1440);
const mm = mins % 1440;
const wd = ['SUN','MON','TUE','WED','THU','FRI','SAT'][(6 + d) % 7];
return { wd: wd, day: 24 + d, time: String(Math.floor(mm / 60)).padStart(2, '0') + ':' + String(mm % 60).padStart(2, '0') };
};
const now = stamp(h);
const deg = ((thm / D) % 360 + 360) % 360;
const illum = Math.round((1 - Math.cos(thm)) / 2 * 100);
const N = 96;
const bw = 358 / N;
let barsDay = ''; let barsNight = ''; let nightBands = '';
for (let i = 0; i < N; i++) {
const hh = span * (i + 0.5) / N;
const tv = venDeg(hh) * D;
const alt = Math.cos(tv - moonDeg(hh) * D);
const sunUp = Math.cos(tv) > 0;
const x = f(i * bw);
const w = f(bw - 0.5);
if (!sunUp) nightBands += 'M' + x + ' 0 h' + f(bw) + ' v52 h-' + f(bw) + ' Z ';
if (alt > 0) {
const seg = 'M' + x + ' 52 h' + w + ' v-' + f(alt * 46) + ' h-' + w + ' Z ';
if (sunUp) barsDay += seg; else barsNight += seg;
}
}
const ticks = [];
for (let i = 0; i < 6; i++) ticks.push({ label: stamp(span * i / 6).time });
const on = '#ECEAE4', off = 'transparent';
// Solar system: heliocentric longitude (deg) at 00:00 PDT 24 Oct 2026, distance (AU), deg per day.
const SS = { mer: [344.1, 0.375, 4.0923], ven: [30.5, 0.724, 1.6021], ear: [30.5, 0.995, 0.9856], mar: [96.7, 1.586, 0.524] };
const SR = { mer: 71, ven: 138, ear: 190, mar: 230 };
const ROT = -60.5;
const Q = (lon, R) => [168 + R * Math.cos((lon + ROT) * D), 118 - R * 0.32 * Math.sin((lon + ROT) * D)];
const lonAt = (k, hh) => SS[k][0] + SS[k][2] * hh / 24;
const pos = (k, hh) => Q(lonAt(k, hh), SR[k]);
const ear = pos('ear', h), ven = pos('ven', h), mer = pos('mer', h), mar = pos('mar', h);
const earPath = (toH) => { const o = []; for (let k = 0; k <= 24; k++) { const q = pos('ear', toH * k / 24); o.push(f(q[0]) + ',' + f(q[1])); } return o.join(' '); };
const sunGeo = lonAt('ear', h) + 180;
const mq = [Math.cos((sunGeo + deg + ROT) * D), -0.32 * Math.sin((sunGeo + deg + ROT) * D)];
const toSun = [168 - ear[0], 118 - ear[1]]; const tl = Math.hypot(toSun[0], toSun[1]) || 1;
const au = (k, hh) => { const l = lonAt(k, hh) * D; return [SS[k][1] * Math.cos(l), SS[k][1] * Math.sin(l)]; };
const ae = au('ear', h), av = au('ven', h);
const vd = Math.hypot(ae[0] - av[0], ae[1] - av[1]);
let ticks2 = '';
for (let k = 0; k < 12; k++) { const lon = 38.4 + k * 29.98; const a = Q(lon, 184), b = Q(lon, 196); ticks2 += 'M' + f(a[0]) + ' ' + f(a[1]) + ' L' + f(b[0]) + ' ' + f(b[1]) + ' '; }
const ml = (lon) => { const q = Q(lon, 208); return [f(Math.max(12, Math.min(346, q[0]))), f(q[1] + 3)]; };
const mJ = ml(98.5), mA = ml(187.2), mL = ml(276.9), mO = ml(7.6);
const ss = {
earX: f(ear[0]), earY: f(ear[1]), earLX: f(ear[0] - 14), earLY: f(ear[1] + 24),
earGX: (0.5 + 0.3 * toSun[0] / tl).toFixed(2), earGY: (0.5 + 0.3 * toSun[1] / tl).toFixed(2),
venX: f(ven[0]), venY: f(ven[1]), venLY: f(ven[1] - 9),
merX: f(mer[0]), merY: f(mer[1]), merLY: f(mer[1] + 14),
marX: f(mar[0]), marY: f(mar[1]), marLX: f(mar[0] - 8), marLY: f(mar[1] - 6),
mooX: f(ear[0] + 15 * mq[0]), mooY: f(ear[1] + 15 * mq[1]),
vdLX: f((ven[0] + ear[0]) / 2), vdLY: f((ven[1] + ear[1]) / 2 + 14), vdText: vd.toFixed(2) + ' AU',
ssTrail: earPath(h), ssProj: earPath(24), ssTicks: ticks2,
mJx: mJ[0], mJy: mJ[1], mAx: mA[0], mAy: mA[1], mLx: mL[0], mLy: mL[1], mOx: mO[0], mOy: mO[1],
ssMoved: (h / 24 * 2.57).toFixed(1)
};
return { ...ss,
secText: this.props.seconds ?? 12,
proj: pathPts(span), trail: pathPts(h),
mx: f(m[0]), my: f(m[1]), mr: f(11 - 2 * sm),
moonHX: f3(0.5 + 0.24 * Math.cos(sig * D)),
backOp: sm >= 0 ? 1 : 0, frontOp: sm < 0 ? 1 : 0,
sunX: f(sunP[0]), sunY: f(sunP[1]),
sunLX: f(Math.max(24, Math.min(334, sunL[0]))), sunLY: f(Math.max(56, Math.min(276, sunL[1]))),
shadow: shadow,
nX1: sunRight ? '0' : '1', nX2: sunRight ? '1' : '0',
nS1: f3(dark - 0.08), nS2: f3(dark + 0.06),
shineX: f3(0.5 + 0.25 * Math.cos(sig * D)), shineOp: (0.35 * lit).toFixed(2),
q0x: q0.x, q0y: q0.y, q1x: q1.x, q1y: q1.y, q2x: q2.x, q2y: q2.y, q3x: q3.x, q3y: q3.y,
l0x: q0.lx, l0y: q0.ly, l1x: q1.lx, l1y: q1.ly, l2x: q2.lx, l2y: q2.ly, l3x: q3.lx, l3y: q3.ly,
land: shapes(LAND, 0), clouds: shapes(CLOUD, h * 1.5),
vx: f(vx), vy: f(vy), vlx: f(vx + 6), vly: f(vy - 6),
vOp: vVis ? 1 : 0, lineOp: up && vVis ? 0.9 : 0,
vFill: up ? '#F2B35E' : '#A3A29C',
upText: up ? 'UP' : 'DOWN',
phaseText: illum + '% ' + (deg < 180 ? 'WAXING' : 'WANING'),
clock: now.wd + ' ' + now.day + ' OCT · ' + now.time + ' · SUN–MOON ' + (deg <= 180 ? Math.round(deg) : Math.round(360 - deg)) + '°',
camText: locked ? 'Camera locked on Venice: Venice always faces you. The Sun and Moon go around it, as they do from the beach.' : 'Camera fixed in space: Earth turns once. The dot is Venice. The Sun stays on the right.',
fBg: locked ? off : on, fFg: locked ? on : '#0A0B0D', vBg: locked ? on : off, vFg: locked ? '#0A0B0D' : on,
fPressed: locked ? 'false' : 'true', vPressed: locked ? 'true' : 'false',
camFixed: () => this.setState({ cam: 'fixed' }),
camVenice: () => this.setState({ cam: 'venice' }),
barsDay: barsDay, barsNight: barsNight, nightBands: nightBands,
headX: f(Math.max(1, Math.min(357, p * 358))),
pVal: Math.round(p * 1000),
ticks: ticks,
playLabel: playing ? 'PAUSE' : 'PLAY',
scrub: (e) => { this.stop(); this.setState({ p: Number(e.target.value) / 1000, playing: false }); },
toggle: () => { if (playing) { this.stop(); this.setState({ playing: false }); } else { this.play(p); } }
};
}
}
