<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sky · Morning</title>
<meta name="theme-color" content="#0A0B0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="/css/app.css">
<style>svg text { font-family: 'IBM Plex Mono', ui-monospace, monospace; }</style>
</head>
<body>
<main>
<header class="head"><h1>SKY</h1><a class="meta" href="/" style="color:var(--amber)">← TODAY</a></header>

<div id="skynotes"></div>

<section style="display:flex;flex-direction:column;gap:8px">
<div class="row"><span>PIER VIEW · END OF VENICE PIER</span><span id="pier-when"></span></div>
<svg id="pier" viewBox="0 0 358 230" tabindex="0" role="img" aria-label="The sky from the end of Venice Pier with the Moon and planets at their real places. Drag or use the arrow keys to turn." style="touch-action:pan-y;cursor:grab;border:1px solid var(--rule);overflow:hidden;user-select:none;-webkit-user-select:none"></svg>
<div class="chips" id="pier-times"></div>
<label for="pier-scrub" class="sr">Time for the pier view</label>
<input id="pier-scrub" type="range" min="0" max="1000" step="1" value="0">
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><button type="button" id="pier-left" aria-label="Turn left 45 degrees">◀ 45°</button><span class="note" id="pier-range"></span><button type="button" id="pier-right" aria-label="Turn right 45 degrees">45° ▶</button></div>
</section>

<section class="sec" id="where" hidden>
<div class="row"><span id="where-title">WHERE TO LOOK</span><span style="display:flex;gap:6px"><button type="button" id="where-live" class="chip" aria-pressed="false">● LIVE</button><button type="button" id="where-close" class="chip">✕</button></span></div>
<svg id="where3d" viewBox="0 0 358 250" role="img" aria-label="Zoomed-out 3D view of Venice Pier with you at the end, the sky dome, and a line to the object." style="touch-action:pan-y;cursor:grab;border:1px solid var(--rule);overflow:hidden;user-select:none;-webkit-user-select:none"></svg>
<p class="note" id="where-text" style="margin:0;font-size:13px;color:var(--text)"></p>
</section>

<section class="sec" id="planets-wrap"><div class="row"><span>PLANETS TONIGHT</span><span>≥10° · DARK</span></div><ul class="planets" id="planets"></ul></section>

<section class="sec" style="display:flex;flex-direction:column;gap:10px">
<div class="row"><span>1 · EARTH + MOON · 00:00 → 24:00</span><span id="loop">LOOP</span></div>
<svg id="earthmoon" viewBox="0 0 358 300" role="img" aria-label="Animated tilted view of the Earth and Moon over today, midnight to midnight. The camera is locked on Venice, so Venice always faces you and the Sun and Moon go around. A dashed line joins Venice to the Moon when the Moon is above the horizon at Venice."></svg>
<div style="display:flex;flex-direction:column;gap:6px">
<div class="row" style="font-size:11px"><span>MOON HEIGHT OVER VENICE</span><span><span style="color:var(--amber)">▮</span> dark sky  <span style="color:#6B6E75">▮</span> daylight</span></div>
<svg viewBox="0 0 358 60" role="img" aria-label="Histogram for today: each bar is how high the Moon is over Venice at that time. Amber bars are when the sky is dark, grey bars are daylight. A line marks the animation time.">
<rect x="0" y="0" width="358" height="52" fill="#15171A"></rect>
<path id="hist-bands" fill="#07080A"></path><g id="hist-grid"></g><path id="hist-day" fill="#6B6E75"></path><path id="hist-night" fill="#F2B35E"></path>
<line x1="0" y1="52" x2="358" y2="52" stroke="#2B2D31"></line>
<line id="playhead" x1="0" y1="0" x2="0" y2="60" stroke="#ECEAE4" stroke-width="1.5"></line><circle id="playdot" cx="0" cy="56" r="3" fill="#ECEAE4"></circle>
</svg>
<label for="scrub" class="sr">Time of day in the animation</label>
<input id="scrub" type="range" min="0" max="1000" step="1" value="0">
<div class="ticks" id="ticks"></div>
</div>
<div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><span class="note">Drag to scrub. It loops at midnight.</span><button id="play" type="button">PAUSE</button></div>
</section>

<section class="sec">
<div class="row"><span>2 · EARTH IN THE SOLAR SYSTEM</span><span>SAME 24 H CLOCK</span></div>
<svg id="solar" viewBox="0 0 358 250" role="img" aria-label="Tilted view of the inner solar system with most of Earth's orbit. Mercury, Venus, Earth, and Mars are at their real positions for the animation time; the Moon is next to Earth. Earth's path for today is amber."></svg>
</section>

<div class="cells" style="--n:3">
<div class="cell"><span class="l">FULL</span><span class="v" id="c-full">—</span></div>
<div class="cell"><span class="l">NEW</span><span class="v" id="c-new">—</span></div>
<div class="cell"><span class="l">DARK SKY</span><span class="v" id="c-dark">—</span></div>
</div>
</main>
<script type="module" src="/js/sky.js"></script>
<script type="module" src="/js/sky-extra.js"></script>
</body>
</html>
